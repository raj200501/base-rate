[project]
name = "baserate"
version = "0.0.1"
description = "Prevalence-aware evaluation of AI agent monitors: recall, precision, cost, and time to catch under a fixed human-review budget."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "raj200501" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
baserate = "baserate.cli:main"

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "ruff==0.14.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baserate"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]
extend-exclude = ["runs", "private"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]
ignore = ["PLR2004", "PLR0913", "PLR0911", "PLR0912", "PLR0915", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/baserate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["baserate"]
branch = false

[tool.coverage.report]
show_missing = true

# Read by tools/ship_check.py (gate G1). Core modules are every module of the
# package except adapters listed here; an adapter may be excluded from the
# coverage floor only if its recorded-fixture contract test exists and passes.
[tool.baserate.coverage]
floor_percent = 85
required_core_packages = ["traces", "monitors", "estimate", "certify", "cascade"]
excluded_adapters = []
